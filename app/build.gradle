plugins { id 'com.android.application' }

// Signing credentials live in the ignored .signing/release.properties file or
// process environment. Keep the release key and passwords out of Git history.
def releaseKeystore = rootProject.file('.signing/paperpdf.jks')
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('.signing/release.properties')
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseStorePassword = System.getenv('PAPERPDF_KEYSTORE_PASSWORD') ?: signingProperties.getProperty('storePassword')
def releaseKeyAlias = System.getenv('PAPERPDF_KEY_ALIAS') ?: signingProperties.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('PAPERPDF_KEY_PASSWORD') ?: signingProperties.getProperty('keyPassword')
def hasReleaseSigning = releaseKeystore.isFile() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'cn.paperpdf.reader'
    compileSdk 35
    buildFeatures { buildConfig true }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    defaultConfig {
        applicationId 'cn.paperpdf.reader'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(project.property('appVersionCode').toString())
        versionName project.property('appVersionName').toString()
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE'] }
    lint { abortOnError true }
}
// Android has no desktop mapped-buffer cleaner. DOC is read through InputStream;
// retain POI's documented unsupported-unmap fallback for Android 6/7 as well.
configurations { poiDesktop { transitive = false } }
def androidPoi = tasks.register('androidPoi', Jar) {
    archiveFileName = 'poi-android-5.4.1.jar'
    destinationDirectory = layout.buildDirectory.dir('android-poi')
    from { configurations.poiDesktop.collect { zipTree(it) } }
    exclude 'org/apache/poi/poifs/nio/CleanerUtil*.class'
    exclude 'META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    poiDesktop 'org.apache.poi:poi:5.4.1'
    implementation files(androidPoi)
    implementation('org.apache.poi:poi-scratchpad:5.4.1') { exclude group: 'org.apache.poi', module: 'poi' }
    implementation 'commons-codec:commons-codec:1.18.0'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'com.zaxxer:SparseBitSet:1.3'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
}
